version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: abdouraman_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-controle_depense}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-changez_ce_mot_de_passe}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
    driver: local
