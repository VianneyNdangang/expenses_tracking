version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: abdouraman_mongo
    restart: always
    ports:
      - "27017:27017"
    entrypoint:
      - bash
      - -c
      - |
        openssl rand -base64 756 > /tmp/mongo-keyfile
        chmod 400 /tmp/mongo-keyfile
        chown 999:999 /tmp/mongo-keyfile
        exec mongod --replSet rs0 --bind_ip_all --keyFile /tmp/mongo-keyfile
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) }" | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      start_period: 5s
      retries: 10

volumes:
  mongo_data:
    driver: local
